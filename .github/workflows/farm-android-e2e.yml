# Lane T7 on Android (goodfood-main tests/mobile-e2e/android): the staging build of one private
# commit on an emulator of this runner (ubuntu-24.04 has KVM), driven by Maestro the way a person
# uses the app, against staging: sign in as a fresh synthetic user, type a meal, pick a real food
# photo from the gallery, confirm the draft, see both on Today, delete one and undo.
#
# Logs and artifacts of a public repository are public. QA_SIGNIN_KEY (the staging-only key that
# reads synthetic users' sign-in codes, already here for the probe and the staging journeys)
# reaches only the journeys step, through its environment. The private
# scripts/test/android-journeys.sh moves it to a private file before any tool starts, types the
# one-time code with adb, and keeps nothing that shows either; android-journeys_test.sh proves it.
# The app is never uploaded: the artifact holds screens, JUnit files, the summary and masked crash
# lines of a synthetic user.
name: farm-android-e2e

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Full commit SHA of Mom-s-Food/goodfood-main; empty runs the default branch below'
        required: false
        default: ''
      upgrade_from:
        description: 'Full commit SHA of the previous build: runs the upgrade journey from it instead (A10)'
        required: false
        default: ''
  push:
    branches: [android-e2e]

permissions:
  contents: read

concurrency:
  group: farm-android-e2e-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true

env:
  PRIVATE_REPO: Mom-s-Food/goodfood-main
  # The private branch a push to this farm branch runs.
  DEFAULT_REF: android-e2e
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  MAESTRO_VERSION: 2.11.0
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
  MAESTRO_CLI_NO_ANALYTICS: '1'
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'

jobs:
  journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Validate the request
        env:
          REF: ${{ inputs.source_ref }}
          FROM: ${{ inputs.upgrade_from }}
        run: |
          set -euo pipefail
          [ -z "$REF" ] || printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::source_ref must be a full lowercase commit SHA"; exit 1; }
          [ -z "$FROM" ] || printf '%s' "$FROM" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::upgrade_from must be a full lowercase commit SHA"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.source_ref || env.DEFAULT_REF }}
          persist-credentials: false
      - name: Check out the previous build's source
        if: ${{ inputs.upgrade_from != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.upgrade_from }}
          persist-credentials: false
          path: previous
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
          add-job-summary: on-failure
      - name: Build the staging release (R8, debug-signed, as the size check does)
        working-directory: android
        run: ./gradlew -Pgoodfood.debugSignedRelease=true :app:assembleStagingRelease
      - name: Build the previous staging release
        if: ${{ inputs.upgrade_from != '' }}
        working-directory: previous/android
        run: ./gradlew -Pgoodfood.debugSignedRelease=true :app:assembleStagingRelease
      - name: Maestro, pinned
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum -c - > /dev/null
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the emulator
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          bash scripts/test/android-emulator.sh "$RUNNER_TEMP/emulator.log"
      - name: Staging answers
        run: curl -fsS --max-time 15 --retry 5 --retry-delay 5 -o /dev/null https://api.64-181-241-30.sslip.io/ready
      - name: The journeys
        env:
          # The key exists only in this step's environment; nothing prints it.
          QA_SIGNIN_KEY: ${{ secrets.QA_SIGNIN_KEY }}
          FROM: ${{ inputs.upgrade_from }}
        run: |
          bash scripts/test/android-journeys.sh \
            --apk android/app/build/outputs/apk/staging/release/app-staging-release.apk \
            ${FROM:+--upgrade-from previous/android/app/build/outputs/apk/staging/release/app-staging-release.apk} \
            --out "$RUNNER_TEMP/journeys"
      - name: Summary
        if: ${{ always() }}
        run: |
          src="$(git rev-parse HEAD)"
          {
            echo "### farm-android-e2e on \`${src:0:12}\`"
            echo
            echo '```'
            cat "$RUNNER_TEMP/journeys/summary.tsv" 2>/dev/null || echo "no journey ran"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/journeys/summary.tsv" 2>/dev/null || true
      - name: Keep the screens and results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/journeys/
          if-no-files-found: ignore
          retention-days: 14
