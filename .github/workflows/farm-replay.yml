# Compatibility replay (TESTING_STRATEGY §9, B9 Task 23) on the local stack of one private
# goodfood-main commit: builds the api and worker images from backend/Dockerfile, starts
# PostgreSQL, migrations, api and worker with infra/compose/dev.yml (scripts/dev/up.sh), then
#   replay: replays the two latest archives per platform in tests/contract/releases against it
#           (tests/contract/live), and
#   record: records the T4 journeys through the recording proxy into a new synthetic archive
#           (tests/contract/replay/cmd/record), replays it once, and keeps it as a one-day
#           artifact for review before it is committed.
#   android: the same, from the Android app's T7 journeys: the mock flavor on an emulator of this
#           runner reaches the recording proxy at 10.0.2.2:4010 (A10). Codes come from the local
#           stack, so no key is needed. Only the screens and the archive are kept.
#
# Logs and artifacts of a public repository are public. Everything here is synthetic: the
# local stack's throwaway database, synthetic users, no model key (AI_MODE=simulated) and no
# secret beyond the private-source checkout. Archives hold placeholders, never a token, a
# sign-in code or an address (the recorder refuses to write one that would), and failure
# messages are redacted before they are printed. Nothing reports to a commit status.
name: farm-replay

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Full commit SHA of Mom-s-Food/goodfood-main; empty uses main'
        required: false
        default: ''
      mode:
        description: 'replay the committed archives, or record a new synthetic archive'
        type: choice
        options: [replay, record, android]
        default: replay
      journeys:
        description: 'record: comma-separated T4 journey names, or all'
        required: false
        default: all
      archive:
        description: 'record: the archive name, <platform>-<version>'
        required: false
        default: synthetic-0.0.0
  schedule:
    # Nightly on main, 19:50 UTC: clear of farm-fuzz (22:23), farm-zap (02:40), farm-perf
    # (Mondays 06:17) and farm-staging-nightly (07:17). See .github/farm-capacity.json.
    - cron: '50 19 * * *'

permissions:
  contents: read

concurrency:
  # One replay (per mode) run at a time on the whole farm (a newer dispatch replaces the queued one, a
  # running one is never cancelled): the free plan has 20 concurrent jobs and farm-ci needs most of
  # them. .github/farm-capacity.json budgets every workflow; scripts/check-farm-workflows.py checks it.
  group: farm-replay-${{ inputs.mode || 'replay' }}
  cancel-in-progress: false

env:
  PRIVATE_REPO: Mom-s-Food/goodfood-main

jobs:
  replay:
    name: replay (${{ inputs.mode || 'replay' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Validate the request
        env:
          REQUESTED: ${{ inputs.source_ref }}
          JOURNEYS: ${{ inputs.journeys }}
          ARCHIVE: ${{ inputs.archive }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ] && ! printf '%s' "$REQUESTED" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source_ref must be a full lowercase commit SHA"; exit 1
          fi
          if [ -n "$JOURNEYS" ] && ! printf '%s' "$JOURNEYS" | grep -Eq '^(all|Test[A-Za-z0-9]+(,Test[A-Za-z0-9]+)*)$'; then
            echo "::error::journeys must be all or a comma-separated list of Test names"; exit 1
          fi
          if [ -n "$ARCHIVE" ] && ! printf '%s' "$ARCHIVE" | grep -Eq '^(android|ios|synthetic)-[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::archive must be <android|ios|synthetic>-X.Y.Z"; exit 1
          fi
      - name: Check out the private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.source_ref || 'main' }}
          persist-credentials: false
      - name: Pin the exact commit
        id: pin
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "goodfood-main $(git rev-parse HEAD)"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The two images the compose file names, from backend/Dockerfile; the cargo-chef
      # dependency layer is cached between runs (GitHub Actions cache, this workflow's scope).
      - name: Build the api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: api
          build-args: SERVER_VERSION=local
          tags: goodfood-api:local
          load: true
          push: false
          cache-from: type=gha,scope=farm-replay
          cache-to: type=gha,scope=farm-replay,mode=max
      - name: Build the worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: worker
          build-args: SERVER_VERSION=local
          tags: goodfood-worker:local
          load: true
          push: false
          cache-from: type=gha,scope=farm-replay
      - name: Start the local stack
        run: scripts/dev/up.sh --no-build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/go.mod
          cache: false
      - name: Replay the release archives
        if: ${{ (inputs.mode || 'replay') == 'replay' }}
        working-directory: tests
        env:
          BASE_URL: http://localhost:8080
        run: go test -count=1 -v ./contract/live/
      - name: Record the T4 journeys into a new archive
        if: ${{ inputs.mode == 'record' }}
        working-directory: tests
        env:
          JOURNEYS: ${{ inputs.journeys || 'all' }}
          ARCHIVE: ${{ inputs.archive || 'synthetic-0.0.0' }}
          SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          go run ./contract/replay/cmd/record -target http://localhost:8080 \
            -out "$RUNNER_TEMP/archive/$ARCHIVE" -journeys "$JOURNEYS" \
            -source "T4 journeys on the local stack (infra/compose/dev.yml), recorded by farm-replay.yml from goodfood-main $SHA"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: ${{ inputs.mode == 'android' }}
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: ${{ inputs.mode == 'android' }}
        with:
          cache-read-only: true
          add-job-summary: on-failure
      - name: Build the mock flavor
        if: ${{ inputs.mode == 'android' }}
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleMockDebug
      - name: Maestro, pinned, and the emulator
        if: ${{ inputs.mode == 'android' }}
        env:
          MAESTRO_VERSION: 2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum -c - > /dev/null
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          bash scripts/test/android-emulator.sh "$RUNNER_TEMP/emulator.log"
      - name: Record the app's journeys into a new archive
        if: ${{ inputs.mode == 'android' }}
        working-directory: tests
        env:
          ARCHIVE: ${{ inputs.archive }}
          SHA: ${{ steps.pin.outputs.sha }}
          MAESTRO_CLI_NO_ANALYTICS: '1'
          MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
        run: |
          set -euo pipefail
          go run ./contract/replay/cmd/record -target http://localhost:8080 -listen 127.0.0.1:4010 \
            -out "$RUNNER_TEMP/archive/$ARCHIVE" -journeys AndroidT7 \
            -source "Android T7 journeys on an emulator, mock flavor on the local stack (infra/compose/dev.yml), recorded by farm-replay.yml from goodfood-main $SHA" \
            -command "bash ../scripts/test/android-journeys.sh --local http://localhost:8080 --apk ../android/app/build/outputs/apk/mock/debug/app-mock-debug.apk --out $RUNNER_TEMP/journeys --flow log-typed-meal --flow undo-a-deleted-meal"
      - name: Keep the journeys' screens
        if: ${{ always() && inputs.mode == 'android' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-journeys
          path: ${{ runner.temp }}/journeys
          retention-days: 3
          if-no-files-found: warn
      - name: Keep the archive for review (one day)
        if: ${{ always() && (inputs.mode == 'record' || inputs.mode == 'android') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-archive
          path: ${{ runner.temp }}/archive
          retention-days: 1
          if-no-files-found: warn
      - name: Stack status
        if: ${{ failure() }}
        run: docker compose -f infra/compose/dev.yml ps || true
