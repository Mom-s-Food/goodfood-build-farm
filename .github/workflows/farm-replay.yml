# Compatibility replay (TESTING_STRATEGY §9, B9 Task 23) on the local stack of one private
# goodfood-main commit: builds the api and worker images from backend/Dockerfile, starts
# PostgreSQL, migrations, api and worker with infra/compose/dev.yml (scripts/dev/up.sh), then
#   replay: replays the two latest archives per platform in tests/contract/releases against it
#           (tests/contract/live), and
#   record: records the T4 journeys through the recording proxy into a new synthetic archive
#           (tests/contract/replay/cmd/record), replays it once, and keeps it as a one-day
#           artifact for review before it is committed.
#   android: records and replays the typed-meal journey from a mock APK on an emulator
#            against the simulated local stack. The verified archive goes to a draft release
#            in the private source repository.
#
# Logs and artifacts of a public repository are public. Everything here is synthetic: the
# local stack's throwaway database, synthetic users, no model key (AI_MODE=simulated) and no
# secret beyond the private-source checkout. Archives hold placeholders, never a token, a
# sign-in code or an address (the recorder refuses to write one that would), and failure
# messages are redacted before they are printed. Nothing reports to a commit status.
name: farm-replay

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Full commit SHA of Mom-s-Food/goodfood-main; empty uses main'
        required: false
        default: ''
      mode:
        description: 'Replay committed archives, record T4, or record the Android mock journey'
        type: choice
        options: [replay, record, android]
        default: replay
      journeys:
        description: 'record: comma-separated T4 journey names, or all'
        required: false
        default: all
      archive:
        description: 'record: <platform>-<version>; android: required, android-<version>'
        required: false
        default: synthetic-0.0.0
  schedule:
    # Nightly on main, 19:50 UTC: clear of farm-fuzz (22:23), farm-zap (02:40), farm-perf
    # (Mondays 06:17) and farm-staging-nightly (07:17). See .github/farm-capacity.json.
    - cron: '50 19 * * *'

permissions:
  contents: read

concurrency:
  # Both record modes share one slot. Scheduled archive replay keeps its existing slot.
  group: farm-replay-${{ inputs.mode == 'android' && 'record' || inputs.mode || 'replay' }}
  cancel-in-progress: false

env:
  PRIVATE_REPO: Mom-s-Food/goodfood-main

jobs:
  replay:
    name: replay (${{ inputs.mode || 'replay' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Validate the request
        env:
          MODE: ${{ inputs.mode || 'replay' }}
          REQUESTED: ${{ inputs.source_ref }}
          JOURNEYS: ${{ inputs.journeys }}
          ARCHIVE: ${{ inputs.archive }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ] && ! printf '%s' "$REQUESTED" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source_ref must be a full lowercase commit SHA"; exit 1
          fi
          if [ -n "$JOURNEYS" ] && ! printf '%s' "$JOURNEYS" | grep -Eq '^(all|Test[A-Za-z0-9]+(,Test[A-Za-z0-9]+)*)$'; then
            echo "::error::journeys must be all or a comma-separated list of Test names"; exit 1
          fi
          if [ -n "$ARCHIVE" ] && ! printf '%s' "$ARCHIVE" | grep -Eq '^(android|ios|synthetic)-[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::archive must be <android|ios|synthetic>-X.Y.Z"; exit 1
          fi
          if [ "$MODE" = android ]; then
            if [ -z "$REQUESTED" ]; then
              echo "::error::source_ref is required for Android replay"; exit 1
            fi
            if ! printf '%s' "$ARCHIVE" | grep -Eq '^android-[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Android replay requires archive=android-X.Y.Z"; exit 1
            fi
          fi
      - name: Check out the private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.source_ref || 'main' }}
          persist-credentials: false
      - name: Pin the exact commit
        id: pin
        env:
          REQUESTED: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          resolved="$(git rev-parse HEAD)"
          if [ -n "$REQUESTED" ] && ! [ "$resolved" = "$REQUESTED" ]; then
            echo "::error::source checkout does not match source_ref"; exit 1
          fi
          printf 'sha=%s\n' "$resolved" >> "$GITHUB_OUTPUT"
          echo "goodfood-main $resolved"
      - name: Require the simulated local stack
        if: ${{ inputs.mode == 'android' }}
        run: |
          set -euo pipefail
          umask 077
          if ! docker compose -f infra/compose/dev.yml config --format json 2>"$RUNNER_TEMP/android-replay-compose.log" |
            python3 -c '
          import json, sys

          services = json.load(sys.stdin)["services"]
          for service in ("api", "worker"):
              env = services[service]["environment"]
              if env.get("ENV") != "local" or env.get("AI_MODE") != "simulated":
                  sys.exit(1)
          ' 2>>"$RUNNER_TEMP/android-replay-compose.log"; then
            echo "::error::Android replay requires a local API and worker in simulated mode"; exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The two images the compose file names, from backend/Dockerfile; the cargo-chef
      # dependency layer is cached between runs (GitHub Actions cache, this workflow's scope).
      - name: Build the api image
        if: ${{ inputs.mode != 'android' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: api
          build-args: SERVER_VERSION=local
          tags: goodfood-api:local
          load: true
          push: false
          cache-from: type=gha,scope=farm-replay
          cache-to: type=gha,scope=farm-replay,mode=max
      - name: Build the worker image
        if: ${{ inputs.mode != 'android' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: worker
          build-args: SERVER_VERSION=local
          tags: goodfood-worker:local
          load: true
          push: false
          cache-from: type=gha,scope=farm-replay
      - name: Build the Android replay stack
        if: ${{ inputs.mode == 'android' }}
        run: |
          set -euo pipefail
          umask 077
          for image in api worker; do
            if ! docker buildx build --file backend/Dockerfile --target "$image" \
              --build-arg SERVER_VERSION=local --tag "goodfood-$image:local" --load . \
              > "$RUNNER_TEMP/android-replay-$image.log" 2>&1; then
              echo "::error::Android replay local stack build failed"; exit 1
            fi
          done
      - name: Start the local stack
        if: ${{ inputs.mode != 'android' }}
        run: scripts/dev/up.sh --no-build
      - name: Start the Android replay stack
        if: ${{ inputs.mode == 'android' }}
        run: |
          set -euo pipefail
          umask 077
          if ! scripts/dev/up.sh --no-build > "$RUNNER_TEMP/android-replay-stack.log" 2>&1; then
            echo "::error::Android replay local stack did not become ready"; exit 1
          fi
      - name: Rust toolchain for standalone suites
        if: ${{ hashFiles('tests/api-e2e/Cargo.toml') != '' }}
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ hashFiles('tests/go.mod') != '' }}
        with:
          go-version-file: tests/go.mod
          cache: false
      - name: Replay the release archives
        if: ${{ (inputs.mode || 'replay') == 'replay' }}
        working-directory: tests
        env:
          BASE_URL: http://localhost:8080
        run: |
          if [ -f contract/Cargo.toml ]; then cargo run --locked --manifest-path contract/Cargo.toml --bin replay-live
          else go test -count=1 -v ./contract/live/; fi
      - name: Record the T4 journeys into a new archive
        if: ${{ inputs.mode == 'record' }}
        working-directory: tests
        env:
          JOURNEYS: ${{ inputs.journeys || 'all' }}
          ARCHIVE: ${{ inputs.archive || 'synthetic-0.0.0' }}
          SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          recorder=(go run ./contract/replay/cmd/record)
          if [ -f contract/Cargo.toml ]; then recorder=(cargo run --locked --manifest-path contract/Cargo.toml --bin record --); fi
          "${recorder[@]}" -target http://localhost:8080 \
            -out "$RUNNER_TEMP/archive/$ARCHIVE" -journeys "$JOURNEYS" \
            -source "T4 journeys on the local stack (infra/compose/dev.yml), recorded by farm-replay.yml from goodfood-main $SHA"
      - name: Keep the archive for review (one day)
        if: ${{ always() && inputs.mode == 'record' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-archive
          path: ${{ runner.temp }}/archive
          retention-days: 1
          if-no-files-found: warn
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: ${{ inputs.mode == 'android' }}
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the mock flavor
        if: ${{ inputs.mode == 'android' }}
        working-directory: android
        run: |
          set -euo pipefail
          umask 077
          if ! ./gradlew --no-daemon :app:assembleMockDebug > "$RUNNER_TEMP/android-replay-build.log" 2>&1; then
            echo "::error::Android replay mock build failed"; exit 1
          fi
      - name: Start the emulator and install the pinned Maestro
        if: ${{ inputs.mode == 'android' }}
        env:
          MAESTRO_VERSION: 2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          set -euo pipefail
          umask 077
          exec 3>&1
          exec > "$RUNNER_TEMP/android-replay-tools.log" 2>&1
          trap 'echo "::error::Android replay emulator or Maestro setup failed" >&3' ERR
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          bash scripts/test/android-emulator.sh "$RUNNER_TEMP/android-replay-emulator.log"
          printf '%s\n' "$RUNNER_TEMP/maestro/bin" "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Record and replay the Android journey
        if: ${{ inputs.mode == 'android' }}
        working-directory: tests
        env:
          ARCHIVE: ${{ inputs.archive }}
          SHA: ${{ steps.pin.outputs.sha }}
          MAESTRO_CLI_NO_ANALYTICS: '1'
          MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
        run: |
          set -euo pipefail
          umask 077
          recorder=(go run ./contract/replay/cmd/record)
          if [ -f contract/Cargo.toml ]; then recorder=(cargo run --locked --manifest-path contract/Cargo.toml --bin record --); fi
          if ! "${recorder[@]}" -target http://127.0.0.1:8080 -listen 127.0.0.1:4010 \
            -out "$RUNNER_TEMP/android-replay-archive/$ARCHIVE" -journeys AndroidT7 \
            -source "Mock Android T7 through a local simulated stack, from goodfood-main $SHA" \
            -command 'bash ../scripts/test/android-journeys.sh --local http://127.0.0.1:4010 --apk ../android/app/build/outputs/apk/mock/debug/app-mock-debug.apk --out "$RUNNER_TEMP/android-replay-journeys" --flow log-typed-meal' \
            > "$RUNNER_TEMP/android-replay-recorder.log" 2>&1; then
            echo "::error::Android journey recording or archive verification failed"; exit 1
          fi
      - name: Deliver the Android archive privately
        if: ${{ inputs.mode == 'android' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          ARCHIVE: ${{ inputs.archive }}
          SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          readonly repository=Mom-s-Food/goodfood-main
          if [ "$(gh api "repos/$repository" --jq '.private' 2>"$RUNNER_TEMP/android-replay-delivery.log")" != true ]; then
            echo "::error::Android replay destination must be private"; exit 1
          fi
          cd "$RUNNER_TEMP/android-replay-archive"
          if [ -L "$ARCHIVE" ]; then
            echo "::error::Android replay archive path is not a directory"; exit 1
          fi
          for file in "$ARCHIVE/manifest.json" "$ARCHIVE/exchanges.jsonl"; do
            if [ ! -s "$file" ] || [ -L "$file" ]; then
              echo "::error::Android replay archive is incomplete"; exit 1
            fi
          done
          bundle="$ARCHIVE.tar.gz"
          tar -czf "$bundle" -- "$ARCHIVE/manifest.json" "$ARCHIVE/exchanges.jsonl"
          sha256sum "$bundle" > SHA256SUMS
          tag="android-replay-${SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! gh release create "$tag" --repo "$repository" --draft --target "$SHA" --title "$tag" \
            "$bundle" SHA256SUMS >> "$RUNNER_TEMP/android-replay-delivery.log" 2>&1; then
            echo "::error::Android replay private delivery failed"; exit 1
          fi
          printf 'Android replay verified at `%s`. Private draft release `%s` in `%s`.\n' \
            "$SHA" "$tag" "$repository" >> "$GITHUB_STEP_SUMMARY"
      - name: Stack status
        if: ${{ failure() && inputs.mode != 'android' }}
        run: docker compose -f infra/compose/dev.yml ps || true
