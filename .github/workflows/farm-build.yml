# Builds the backend images of one private goodfood-main commit on public runners
# and pushes them to the private GHCR packages (ghcr.io/mom-s-food/goodfood-main/
# api and worker), publishes the Helm chart when its version is new, and, for a
# commit that is still the tip of main and has passed farm/ci, pins the new
# digests in infra/deploy/staging on main. Flux on the staging node deploys from
# there (ADR-0017, ADR-0018). Production is never touched here (AGENTS.md:
# production deploys need the owner's approval).
#
# arm64 only: the OCI nodes are Ampere A1. Each run uploads a release receipt with
# the source commit and the image digests.
#
# The three release binaries are compiled once, natively on an arm64 runner, with the
# toolchain backend/Dockerfile pins (Rust, Zig, cargo-zigbuild) and its release
# settings, and their dependencies cached; each image is then packaged from
# backend/Dockerfile's own runtime stages with the prebuilt binaries copied in.
name: farm-build

on:
  repository_dispatch:
    types: [trigger-build]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Full commit SHA of Mom-s-Food/goodfood-main; empty builds main'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: farm-build
  cancel-in-progress: false

env:
  PRIVATE_REPO: Mom-s-Food/goodfood-main
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/mom-s-food/goodfood-main
  CHART_REPO: oci://ghcr.io/mom-s-food/goodfood-main/charts
  HELM_VERSION: v3.22.0
  RUST_TARGET: aarch64-unknown-linux-musl

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_ref: ${{ steps.pin.outputs.source_ref }}
    steps:
      - name: Validate the request
        env:
          REQUESTED: ${{ github.event.client_payload.source_ref || inputs.source_ref }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ] && ! printf '%s' "$REQUESTED" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source_ref must be a full lowercase commit SHA"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ github.event.client_payload.source_ref || inputs.source_ref || 'main' }}
          persist-credentials: false
      - name: Pin the exact commit
        id: pin
        run: printf 'source_ref=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  binaries:
    needs: setup
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      SQLX_OFFLINE: "true"
      # backend/Dockerfile's build stage settings.
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - name: Check out the pinned private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ needs.setup.outputs.source_ref }}
          persist-credentials: false
      # The binaries depend only on backend/ (Dockerfile included) and the contract; a commit
      # that changes neither reuses the binaries built for an earlier one.
      - name: Binaries built from the same sources
        id: bins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dist/out
          key: farm-bins-v1-${{ env.RUST_TARGET }}-${{ hashFiles('backend/**', 'contracts/openapi/**') }}
      - name: The toolchain backend/Dockerfile pins
        if: steps.bins.outputs.cache-hit != 'true'
        id: pins
        run: |
          set -euo pipefail
          df=backend/Dockerfile
          rust="$(sed -nE 's/^ARG RUST_VERSION=([0-9.]+)$/\1/p' "$df")"
          zig="$(sed -nE 's/.*ziglang==([0-9.]+).*/\1/p' "$df")"
          zigbuild="$(sed -nE 's/.*--version ([0-9.]+) cargo-zigbuild.*/\1/p' "$df")"
          for v in "$rust" "$zig" "$zigbuild"; do printf '%s' "$v" | grep -Eq '^[0-9]+(\.[0-9]+)+$' || { echo "::error::cannot read the toolchain pins from $df"; exit 1; }; done
          echo "rust=$rust zig=$zig cargo-zigbuild=$zigbuild"
          { echo "rust=$rust"; echo "zig=$zig"; echo "zigbuild=$zigbuild"; } >> "$GITHUB_OUTPUT"
      - name: Rust ${{ steps.pins.outputs.rust }} for ${{ env.RUST_TARGET }}
        if: steps.bins.outputs.cache-hit != 'true'
        env:
          RUST_VERSION: ${{ steps.pins.outputs.rust }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$RUST_TARGET" --no-self-update
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      - name: Zig ${{ steps.pins.outputs.zig }}
        if: steps.bins.outputs.cache-hit != 'true'
        env:
          ZIG_VERSION: ${{ steps.pins.outputs.zig }}
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet "ziglang==$ZIG_VERSION"
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - name: cargo-zigbuild
        if: steps.bins.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-zigbuild@${{ steps.pins.outputs.zigbuild }}
      - name: Restore the release dependency cache
        if: steps.bins.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          shared-key: farm-release-arm64
          cache-bin: "false"
      - name: Build api, worker and migrate once (static musl)
        if: steps.bins.outputs.cache-hit != 'true'
        working-directory: backend
        run: |
          set -euo pipefail
          cargo zigbuild --release --locked --target "$RUST_TARGET" -p goodfood-api -p goodfood-worker -p goodfood-migrate
          out="$RUNNER_TEMP/dist/out"; mkdir -p "$out"
          for b in api worker migrate; do
            install -m 0755 "target/$RUST_TARGET/release/$b" "$out/$b"
            if readelf -d "$out/$b" | grep -q NEEDED || readelf -l "$out/$b" | grep -q INTERP; then
              echo "::error::$b is not statically linked"; exit 1
            fi
          done
          ls -l "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/dist/out
          if-no-files-found: error
          retention-days: 1

  images:
    needs: [setup, binaries]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [api, worker]
    steps:
      - name: Check out the pinned private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ needs.setup.outputs.source_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: .farm/out
      # backend/Dockerfile with its compile stages replaced by the prebuilt binaries: the
      # runtime stages (base image, user, recordings, entrypoints) are its own, verbatim.
      - name: Package backend/Dockerfile around the prebuilt binaries
        run: |
          set -euo pipefail
          chmod 0755 .farm/out/*; mkdir -p .farm/empty
          python3 -I - backend/Dockerfile .farm/Dockerfile <<'PY'
          import re, sys
          src = open(sys.argv[1], encoding="utf-8").read()
          start = re.search(r"^FROM chef AS build$", src, re.M)
          end = re.search(r"^FROM gcr\.io/distroless/\S+ AS runtime$", src, re.M)
          if not start or not end or end.start() < start.start():
              sys.exit("backend/Dockerfile: no 'FROM chef AS build' stage before the distroless runtime stage")
          build = "FROM scratch AS build\nCOPY .farm/out/ /out/\nCOPY .farm/empty/ /empty/\n\n"
          open(sys.argv[2], "w", encoding="utf-8").write(src[: start.start()] + build + src[end.start():])
          PY
          printf '%s\n' '*' '!.farm/out' '!.farm/empty' '!backend/testdata/recordings' > .farm/Dockerfile.dockerignore
          diff backend/Dockerfile .farm/Dockerfile || true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Build and push ${{ matrix.target }} (arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .farm/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/arm64
          build-args: SERVER_VERSION=${{ needs.setup.outputs.source_ref }}
          tags: ${{ env.IMAGE_BASE }}/${{ matrix.target }}:${{ needs.setup.outputs.source_ref }}
          push: true
          provenance: false
      - name: The image starts (static binary, right architecture)
        env:
          IMAGE: ${{ env.IMAGE_BASE }}/${{ matrix.target }}@${{ steps.build.outputs.digest }}
        run: |
          set -uo pipefail
          rc=0; out="$(timeout 20 docker run --rm "$IMAGE" 2>&1)" || rc=$?
          printf '%s\n' "$out" | tail -n 5
          if [ "$rc" -eq 126 ] || [ "$rc" -eq 127 ] || grep -qiE 'exec format error|no such file or directory' <<<"$out"; then
            echo "::error::the ${{ matrix.target }} image does not start (exit $rc)"; exit 1
          fi
          echo "started (exit $rc; it has no configuration here)"
      - name: Write the release receipt
        env:
          TARGET: ${{ matrix.target }}
          SOURCE: ${{ needs.setup.outputs.source_ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          mkdir -p "$RUNNER_TEMP/release"
          jq -n --arg source_ref "$SOURCE" --arg target "$TARGET" \
            --arg image "$IMAGE_BASE/$TARGET@$DIGEST" \
            '{source_ref:$source_ref,target:$target,image:$image}' > "$RUNNER_TEMP/release/$TARGET.json"
          cat "$RUNNER_TEMP/release/$TARGET.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/release/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30

  chart:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.push.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ needs.setup.outputs.source_ref }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Publish the chart if this version is new
        id: push
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail
          # The output always carries Chart.yaml's version, so a version published by an
          # earlier run that never reached staging is still pinned.
          version="$(awk '/^version:/{print $2}' infra/helm/goodfood/Chart.yaml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          if out="$(helm show chart "$CHART_REPO/goodfood" --version "$version" 2>&1)"; then
            echo "chart $version is already published"
            exit 0
          fi
          # Push only on a genuine not-found; any other error (auth, network) fails
          # instead of overwriting a published version.
          if ! grep -qiE 'not found|manifest unknown|404' <<<"$out"; then
            echo "::error::could not check whether chart $version exists"
            exit 1
          fi
          helm package infra/helm/goodfood --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/goodfood-$version.tgz" "$CHART_REPO"

  deploy-staging:
    needs: [setup, images, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: farm-deploy-staging
      cancel-in-progress: false
    steps:
      # The gate never waits on a runner for farm/ci (a poller held one of the 20 job slots for up
      # to an hour while farm-ci itself queued for them). When farm/ci is still pending it posts
      # farm/deploy=pending ('waiting for farm/ci') pointing at this run and ends; farm-ci's report
      # re-runs this job once farm/ci passes for the commit, and the gate then goes ahead.
      - name: Only the tip of main, and only once farm/ci has passed
        id: gate
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          SHA: ${{ needs.setup.outputs.source_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          deploy_status() {
            gh api "repos/$PRIVATE_REPO/statuses/$SHA" -X POST -f context=farm/deploy \
              -f target_url="$RUN_URL" -f state="$1" -f description="$2" > /dev/null
          }
          ci_state() {
            gh api "repos/$PRIVATE_REPO/commits/$SHA/status" \
              --jq '[.statuses[] | select(.context == "farm/ci")][0].state // "missing"'
          }
          tip="$(gh api "repos/$PRIVATE_REPO/commits/main" --jq .sha)"
          if [ "$tip" != "$SHA" ]; then
            echo "::notice::$SHA is not the tip of main ($tip); staging is not bumped"
            [ "$ATTEMPT" = 1 ] || deploy_status success "not deployed: no longer the tip of main"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          state="$(ci_state)"
          if [ "$state" != success ] && [ "$state" != failure ] && [ "$state" != error ]; then
            # Post first, then look again: farm-ci's report posts farm/ci first and then reads
            # farm/deploy, so one of the two always sees the other.
            deploy_status pending "waiting for farm/ci; farm-ci re-runs this job when it passes"
            state="$(ci_state)"
          fi
          case $state in
            success) echo "go=true" >> "$GITHUB_OUTPUT" ;;
            failure | error)
              deploy_status error "not deployed: farm/ci is $state"
              echo "::error::farm/ci is $state for $SHA; staging is not bumped"; exit 1 ;;
            *)
              echo "::notice::farm/ci is $state for $SHA; farm-ci's report re-runs this job when it passes"
              echo "go=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - if: steps.gate.outputs.go == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main
          fetch-depth: 0
      - name: Pin the new digests and chart on main
        if: steps.gate.outputs.go == 'true'
        env:
          SHA: ${{ needs.setup.outputs.source_ref }}
          CHART: ${{ needs.chart.outputs.version }}
        run: |
          set -euo pipefail
          digest() { jq -r .image "$RUNNER_TEMP/release/$1.json" | sed 's/.*@//'; }
          jq -n --arg api "$(digest api)" --arg worker "$(digest worker)" --arg chart "$CHART"             '{"api-digest": $api, "worker-digest": $worker, "chart-version": $chart}' > "$RUNNER_TEMP/pins.json"
          cat "$RUNNER_TEMP/pins.json"
          changed="$(python3 -I scripts/lib/pins.py apply "$RUNNER_TEMP/pins.json" infra/deploy/staging/release.yaml)"
          if [ -z "$changed" ]; then echo "staging already runs $SHA"; exit 0; fi
          bash scripts/ci/check-deploy-pins.sh --env staging
          git config user.name "goodfood-build-farm"
          git config user.email "goodfood-build-farm@users.noreply.github.com"
          # [skip ci] keeps this commit from dispatching the farm again (no loop).
          git commit -am "deploy(staging): ${SHA:0:12} [skip ci]" -m "Source-Commit: $SHA"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::could not push the staging pins to main"; exit 1
      - name: Record the deploy on the private commit
        if: ${{ !cancelled() && steps.gate.outputs.go == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          SHA: ${{ needs.setup.outputs.source_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PINNED: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$PINNED" = success ]; then state=success; desc="staging pinned to this commit"; else state=error; desc="pinning staging failed"; fi
          gh api "repos/$PRIVATE_REPO/statuses/$SHA" -X POST -f context=farm/deploy \
            -f target_url="$RUN_URL" -f state="$state" -f description="$desc" > /dev/null
