# Runs one allowlisted, file-writing cargo task on a branch of the private
# Mom-s-Food/goodfood-main repository and pushes the result back to that branch
# as one commit. It exists because nobody builds the backend on a laptop (owner
# rule, 2026-10-30): generated files that only a cargo run can produce are made
# here. Tasks:
#   gen-cases  cargo run -p goodfood-evals --bin gen_cases -- --root ../evals [--suite NAME]
#   fmt        cargo fmt --all
# Never runs on main, never on a tag, never anything but the two tasks above.
name: farm-task

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch of Mom-s-Food/goodfood-main (not main)'
        required: true
      task:
        description: 'gen-cases or fmt'
        required: true
        type: choice
        options: [gen-cases, fmt]
      suite:
        description: 'gen-cases only: one suite name; empty regenerates every suite the generator owns'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: farm-task-${{ inputs.branch }}
  cancel-in-progress: false

env:
  PRIVATE_REPO: Mom-s-Food/goodfood-main
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  task:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate the request
        env:
          BRANCH: ${{ inputs.branch }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          printf '%s' "$BRANCH" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$' || { echo "::error::bad branch name"; exit 1; }
          case $BRANCH in main | refs/* | */main) echo "::error::refusing to write to $BRANCH"; exit 1 ;; esac
          [ -z "$SUITE" ] || printf '%s' "$SUITE" | grep -Eq '^[a-z0-9-]{1,40}$' || { echo "::error::bad suite name"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.branch }}
      - name: Rust toolchain (stable, with rustfmt)
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
      - name: Cache the cargo registry and target directory
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            backend/target
          key: farm-task-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml') }}
          restore-keys: farm-task-${{ runner.os }}-
      - name: Run the task
        working-directory: backend
        env:
          TASK: ${{ inputs.task }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          case $TASK in
            gen-cases)
              if [ -n "$SUITE" ]; then
                cargo run --quiet --locked -p goodfood-evals --bin gen_cases -- --root ../evals --suite "$SUITE"
              else
                cargo run --quiet --locked -p goodfood-evals --bin gen_cases -- --root ../evals
              fi ;;
            fmt) cargo fmt --all ;;
          esac
      - name: Commit and push the result to the branch
        env:
          BRANCH: ${{ inputs.branch }}
          TASK: ${{ inputs.task }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then echo "nothing changed"; exit 0; fi
          git status --short
          git config user.name "goodfood-build-farm"
          git config user.email "goodfood-build-farm@users.noreply.github.com"
          git add -A
          git commit -q -m "chore(farm): $TASK${SUITE:+ --suite $SUITE}" -m "Generated by goodfood-build-farm farm-task.yml run ${{ github.run_id }}."
          for _ in 1 2 3; do
            git push origin "HEAD:$BRANCH" && exit 0
            git pull --rebase origin "$BRANCH"
          done
          echo "::error::could not push to $BRANCH"; exit 1
