# Branch aip-live-bin only, not for farm main. Builds the evals command for Windows from one commit of the private
# source and keeps it as a draft release of that private repository, so the provider live check can run on the owner's
# machine with GEMINI_API_KEY_DEV in its environment: the key gets no farm copy (custody rule 5) and nobody runs cargo
# there. The binary embeds the prompts, so it never becomes a public artifact of this repository. No key reaches this
# workflow, and the build log uses the short message format, which prints no source lines.
name: farm-task

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Full commit SHA of Mom-s-Food/goodfood-main'
        required: true
      task:
        description: 'Only evals-windows'
        required: true
        type: choice
        options: [evals-windows]
      suite:
        description: 'Unused'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: farm-task-evals-windows
  cancel-in-progress: false

env:
  PRIVATE_REPO: Mom-s-Food/goodfood-main
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  task:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the request
        env:
          SHA: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::give a full commit SHA"; exit 1; }
      - name: Keep the source bytes as they are (the prompts are compiled in)
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.branch }}
          persist-credentials: false
      - name: Build the evals command
        working-directory: backend
        run: |
          set -euo pipefail
          cargo build --quiet --locked --message-format=short -p goodfood-evals --bin evals
          ls -la target/debug/evals.exe
      - name: Keep it as a draft release of the private repository
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          SHA: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          tag="evals-windows-${SHA:0:12}"
          gh release create "$tag" --repo "$PRIVATE_REPO" --draft --title "$tag" \
            --notes "Temporary: the evals command for the provider live check, built by farm run $GITHUB_RUN_ID. Delete after use." \
            backend/target/debug/evals.exe
