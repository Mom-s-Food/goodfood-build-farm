# Verifies the B9 synthetic cohort tooling of one private goodfood-main commit on
# the local stack (Docker Compose), as tests/synthetic/seed_test.go expects: it
# seeds three synthetic users through the public API (scripts/dev/seed-synthetic.sh's
# Go package), seeds them again (every user skipped), then runs
# tests/synthetic/driver.js in smoke mode for two minutes with the k6 binary of
# the image staging pins (infra/deploy/staging/synthetic/deployment.yaml).
#
# The stack runs the api and worker images staging runs (the digests pinned in
# infra/deploy/staging/release.yaml of that commit), with the compose file's
# local settings (ENV=local, AI_MODE=simulated, codes from /local/signin-code), so
# nothing is built here and no key is used: the local stack needs none.
#
# Logs are public: the steps print counts and statuses, never a sign-in code or a
# token (the local stack's are throwaway, and still not printed).
name: farm-synthetic

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Full commit SHA of Mom-s-Food/goodfood-main'
        required: true
      driver_duration:
        description: 'How long the driver runs (a k6 duration)'
        required: false
        default: '2m'
      images:
        description: 'staging: the digests staging pins at that commit; source: the images farm-build.yml built from source_ref (api:<sha>, worker:<sha>)'
        required: false
        type: choice
        options: [staging, source]
        default: staging

permissions:
  contents: read

concurrency:
  # One synthetic run at a time on the whole farm (a newer dispatch replaces the queued one, a
  # running one is never cancelled): the free plan has 20 concurrent jobs and farm-ci needs most of
  # them. .github/farm-capacity.json budgets every workflow; scripts/check-farm-workflows.py checks it.
  group: farm-synthetic
  cancel-in-progress: false

env:
  PRIVATE_REPO: Mom-s-Food/goodfood-main
  IMAGE_BASE: ghcr.io/mom-s-food/goodfood-main

jobs:
  local-stack:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Validate the request
        env:
          REF: ${{ inputs.source_ref }}
          DUR: ${{ inputs.driver_duration }}
        run: |
          set -euo pipefail
          printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::source_ref must be a full lowercase commit SHA"; exit 1; }
          printf '%s' "$DUR" | grep -Eq '^[0-9]{1,2}m$' || { echo "::error::driver_duration must be minutes, such as 2m"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: The api and worker images, as the compose file's local tags
        env:
          IMAGES: ${{ inputs.images }}
          REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          pins="$(python3 -I scripts/lib/pins.py read infra/deploy/staging/release.yaml)"
          for t in api worker; do
            if [ "$IMAGES" = source ]; then
              ref="$IMAGE_BASE/$t:$REF"
            else
              d="$(python3 -I -c 'import json,sys; print(json.loads(sys.argv[1])[sys.argv[2] + "-digest"])' "$pins" "$t")"
              printf '%s' "$d" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::no $t digest pinned"; exit 1; }
              ref="$IMAGE_BASE/$t@$d"
            fi
            docker pull --quiet "$ref" > /dev/null
            docker tag "$ref" "goodfood-$t:local"
            echo "$t $ref"
          done
      - name: k6 from the pinned image
        run: |
          set -euo pipefail
          if [ ! -f infra/deploy/staging/synthetic/deployment.yaml ]; then
            echo "::error::this commit has no infra/deploy/staging/synthetic/deployment.yaml (B9 Tasks 1 and 2); dispatch a commit that has the synthetic cohort"
            exit 1
          fi
          img="$(sed -nE 's/^[[:space:]]*image:[[:space:]]*(grafana\/k6[^ ]*@sha256:[0-9a-f]{64}).*/\1/p' infra/deploy/staging/synthetic/deployment.yaml)"
          [ -n "$img" ] || { echo "::error::no pinned grafana/k6 image in the synthetic deployment"; exit 1; }
          docker pull --quiet "$img" > /dev/null
          id="$(docker create "$img")"
          docker cp "$id:/usr/bin/k6" "$RUNNER_TEMP/k6"
          docker rm "$id" > /dev/null
          sudo install -m 0755 "$RUNNER_TEMP/k6" /usr/local/bin/k6
          k6 version
      - name: Start the local stack
        run: |
          set -euo pipefail
          docker compose -f infra/compose/dev.yml up -d --no-build --quiet-pull
          for _ in $(seq 1 90); do
            if curl -fsS -o /dev/null --max-time 2 http://localhost:8080/ready; then echo "ready"; exit 0; fi
            sleep 2
          done
          docker compose -f infra/compose/dev.yml ps
          echo "::error::the api did not become ready"; exit 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/go.mod
          cache: false
      - name: Seed, seed again, and drive (tests/synthetic)
        working-directory: tests
        env:
          SYNTHETIC_BASE_URL: http://localhost:8080
          DRIVER_TEST_DURATION: ${{ inputs.driver_duration }}
        run: go test ./synthetic/ -count=1 -v -timeout 30m
      - name: Stack status
        if: ${{ always() }}
        run: docker compose -f infra/compose/dev.yml ps --format '{{.Service}} {{.State}} {{.Status}}' || true
      # Warnings and errors only, with every six-digit number and every long token-like string
      # masked, so no sign-in code or token is printed (the local stack's are throwaway anyway).
      - name: Warnings and errors of the api and worker
        if: ${{ failure() }}
        run: |
          docker compose -f infra/compose/dev.yml logs --no-color --no-log-prefix api worker 2>/dev/null \
            | grep -Ei '"level":"(warn|error)"' \
            | sed -E 's/[0-9]{6}/######/g; s/[A-Za-z0-9+\/=._-]{32,}/<masked>/g' | cut -c1-600 | tail -60 || true
