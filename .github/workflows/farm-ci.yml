# Checks one commit of the private Mom-s-Food/goodfood-main repository on public
# runners (unlimited minutes for a public repository). This repository holds no
# application source: every job checks the private source out with the
# PRIVATE_REPO_PAT secret, never persists the credential, and reports the result
# back to the private commit as the `farm/ci` status.
#
# Logs of a public repository are public. Nothing here prints a secret, test data
# is synthetic, and CARGO_TERM_COLOR=never keeps the logs plain; a compiler error
# does quote the failing source lines, which the owner accepted (2026-11-03).
#
# Layout (every job after setup runs in parallel):
#   setup ─┬─ rust-lint: fmt, clippy, generated api-types ──────────┬─ rust (aggregate) ─┐
#          ├─ rust-test 1/3, 2/3, 3/3: build and run the tests, doc ┘                    │
#          │  tests and the evaluation dataset check of a third of the packages each     │
#          ├─ supply-chain: cargo-deny, cargo-audit ─────────────────────────────────────┤
#          └─ scripts: every non-Rust check of the private ci.yml ──────────────────────┴─ report
# Speed: Swatinem/rust-cache keeps the compiled dependencies of each job (small, because
# no debuginfo; saved only from commits on main, so branches do not churn the 10 GB
# repository cache); the tests run in three partitions against a PostgreSQL on tmpfs
# with fsync off. The report job posts farm/ci and then succeeds: a failure shows as red
# on the job where it happened (rust's sub-jobs, supply-chain or scripts), not twice.
name: farm-ci

on:
  repository_dispatch:
    types: [trigger-ci]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Full commit SHA of Mom-s-Food/goodfood-main; empty checks main'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: farm-ci-${{ github.event.client_payload.source_ref || inputs.source_ref || 'main' }}
  cancel-in-progress: true

env:
  PRIVATE_REPO: Mom-s-Food/goodfood-main
  STATUS_CONTEXT: farm/ci
  NEXTEST_VERSION: 0.9.148
  OPENAPI_TO_RUST_VERSION: 0.23.0
  CARGO_DENY_VERSION: 0.20.2
  CARGO_AUDIT_VERSION: 0.22.2
  # The same tool versions as the private ci.yml.
  HELM_VERSION: v3.22.0
  KUSTOMIZE_VERSION: v5.8.1
  KUBECONFORM_VERSION: v0.8.0
  TOFU_VERSION: 1.12.1
  TFLINT_VERSION: v0.64.0
  TRIVY_VERSION: v0.75.0
  GITLEAKS_VERSION: 8.30.1
  ACTIONLINT_VERSION: 1.7.12
  PYYAML_VERSION: 6.0.3

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_ref: ${{ steps.pin.outputs.source_ref }}
      on_main: ${{ steps.main.outputs.on_main }}
    steps:
      - name: Validate the request
        env:
          REQUESTED: ${{ github.event.client_payload.source_ref || inputs.source_ref }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ] && ! printf '%s' "$REQUESTED" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source_ref must be a full lowercase commit SHA"; exit 1
          fi
          [ -n "$REQUESTED" ] || exit 0
          # A SHA that does not exist (mistyped, or only its prefix is real) fails here at once
          # instead of in the checkout's retry loop ('not our ref'). Dispatch with the output of
          # `git rev-parse <branch>`. Any other API error falls through to the checkout.
          for i in 1 2 3; do
            if out="$(gh api "repos/$PRIVATE_REPO/commits/$REQUESTED" --jq .sha 2>&1)"; then
              [ "$out" = "$REQUESTED" ] && exit 0
              echo "::error::source_ref $REQUESTED resolves to $out; dispatch the full SHA from git rev-parse"; exit 1
            fi
            if grep -qE 'No commit found|HTTP 404|HTTP 422' <<<"$out"; then
              echo "::error::source_ref $REQUESTED is not a commit of $PRIVATE_REPO (not pushed, or typed by hand); dispatch the output of git rev-parse <branch>"
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "::warning::could not look $REQUESTED up; the checkout decides"
      - name: Resolve the private source once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ github.event.client_payload.source_ref || inputs.source_ref || 'main' }}
          persist-credentials: false
      - name: Pin the exact commit
        id: pin
        run: printf 'source_ref=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Mark the private commit pending
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          SHA: ${{ steps.pin.outputs.source_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$PRIVATE_REPO/statuses/$SHA" -X POST \
            -f state=pending -f context="$STATUS_CONTEXT" -f target_url="$RUN_URL" \
            -f description="Build farm checks running" > /dev/null
      # Only runs of commits on main save the Rust caches (and only when Cargo.lock or the
      # toolchain changed): one entry per kind, which every branch then restores, so branches
      # never churn the 10 GB repository cache.
      - name: Is this commit on main
        id: main
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          SHA: ${{ steps.pin.outputs.source_ref }}
        run: |
          set -euo pipefail
          rel="$(gh api "repos/$PRIVATE_REPO/compare/main...$SHA" --jq .status || echo unknown)"
          case $rel in identical | behind) on_main=true ;; *) on_main=false ;; esac
          echo "on_main=$on_main" >> "$GITHUB_OUTPUT"; echo "on main: $on_main ($rel)"

  rust-lint:
    name: rust / fmt, clippy, api-types
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out the pinned private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ needs.setup.outputs.source_ref }}
          persist-credentials: false
      - name: Rust toolchain (stable, with clippy and rustfmt)
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
      - name: Format
        working-directory: backend
        run: cargo fmt --all --check
      - name: Restore the clippy dependency cache
        if: ${{ !cancelled() }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          shared-key: farm-clippy
          cache-bin: "false"
          save-if: ${{ needs.setup.outputs.on_main == 'true' }}
      - name: Clippy (warnings are errors)
        # Run even when an earlier check failed, so one push reports every problem; the job still fails.
        if: ${{ !cancelled() }}
        working-directory: backend
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: Cache openapi-to-rust
        if: ${{ !cancelled() }}
        id: o2r
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/openapi-to-rust
          key: farm-o2r-${{ runner.os }}-${{ env.OPENAPI_TO_RUST_VERSION }}
      - name: Install openapi-to-rust
        if: ${{ !cancelled() && steps.o2r.outputs.cache-hit != 'true' }}
        run: cargo install --locked --version "$OPENAPI_TO_RUST_VERSION" openapi-to-rust
      - name: Generated api-types match the contract
        if: ${{ !cancelled() }}
        run: scripts/contracts/generate-rs.sh --check

  # The tests, doc tests and the evaluation dataset check in three partitions of whole
  # packages, each compiled and run on its own runner (no test archive to ship around:
  # 1.7 GB took longer to download than to build). Packages are balanced by their measured
  # test time; a package missing from the table counts as small and still runs.
  rust-test:
    name: rust / tests ${{ matrix.partition }}/3
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        partition: [1, 2, 3]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      # No debuginfo: a panic still names its file and line; the target shrinks to a fraction.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      NEXTEST_HIDE_PROGRESS_BAR: "1"
      GOODFOOD_TEST_DATABASE_URL: postgres://postgres:goodfood@localhost:5432/postgres?sslmode=disable
      # The prompt and derivation ledger tests compare with main (they must not skip silently).
      GOODFOOD_DERIVATION_BASE: origin/main
      GOODFOOD_PROMPT_BASE: origin/main
    steps:
      # A throwaway server: data on tmpfs, no fsync, no full-page writes. Durability means
      # nothing here and the tests create and drop hundreds of databases.
      - name: Start PostgreSQL 18 (tmpfs, fsync off)
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=goodfood \
            --tmpfs /var/lib/postgresql:rw,size=8g \
            postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873 \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c max_connections=300 -c shared_buffers=512MB > /dev/null
      - name: Check out the pinned private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ needs.setup.outputs.source_ref }}
          persist-credentials: false
          # The prompt-ledger and derivation-ledger tests compare with origin/main.
          fetch-depth: 0
      - name: Verify the source
        env:
          EXPECTED: ${{ needs.setup.outputs.source_ref }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED" ]
          [ -z "$(git status --porcelain)" ]
      - name: Rust toolchain (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: cargo-nextest
        env:
          RELEASE_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${RUNNER_OS:-}" == Linux && "${RUNNER_ARCH:-}" == X64 && "$NEXTEST_VERSION" == 0.9.148 ]] || { echo '::error::unsupported nextest pin or runner'; exit 1; }
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          archive="$RUNNER_TEMP/nextest.tar.gz"
          url="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          if ! curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 15 --max-time 180 --retry 2 --retry-max-time 240 -o "$archive" "$url"; then
            curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 15 --max-time 180 --retry 2 --retry-max-time 240 -H "Authorization: Bearer ${RELEASE_API_TOKEN:?}" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' -o "$archive" 'https://api.github.com/repos/nextest-rs/nextest/releases/assets/620598748'
          fi
          printf '%s  %s\n' 223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$bin" cargo-nextest
          export PATH="$bin:$PATH"
          cargo nextest --version | grep -F "cargo-nextest $NEXTEST_VERSION"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Restore the dependency cache of this partition
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          shared-key: farm-tests-${{ matrix.partition }}
          cache-bin: "false"
          save-if: ${{ needs.setup.outputs.on_main == 'true' }}
      - name: Packages of partition ${{ matrix.partition }}
        id: part
        working-directory: backend
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 --locked > "$RUNNER_TEMP/metadata.json"
          python3 -I - "$RUNNER_TEMP/metadata.json" "$PARTITION" 3 > "$RUNNER_TEMP/part.txt" <<'PY'
          import json, sys
          meta, k, n = json.load(open(sys.argv[1])), int(sys.argv[2]), int(sys.argv[3])
          # Seconds of test time per package on 4 threads (farm runs 41116118848 and
          # 41115125501, before and after the template database), 3 for any other package.
          # rest adds about 220 for its build (it depends on nearly every crate), and
          # goodfood-evals stands for the evaluation dataset check.
          weight = {"rest": 420, "foods": 211, "agent": 150, "coach": 113, "app": 85,
                    "kitchen": 85, "logging": 65, "intent": 45, "imports": 35,
                    "platform-jobs": 35, "goals": 30, "planner": 30, "identity": 28,
                    "preferences": 22, "platform-db": 17, "profile": 17, "analytics": 14,
                    "platform-httpx": 10, "shopping": 9, "privacy": 9, "evals": 8,
                    "platform-ai": 6, "goodfood-evals": 120}
          pkgs = sorted(meta["packages"], key=lambda p: (-weight.get(p["name"], 3), p["name"]))
          parts, load = [[] for _ in range(n)], [0] * n
          for p in pkgs:  # heaviest first, each to the lightest partition
              i = min(range(n), key=lambda j: (load[j], j))
              parts[i].append(p)
              load[i] += weight.get(p["name"], 3)
          mine = parts[k - 1]
          def sel(ps):
              return " ".join("-p " + p["name"] for p in ps)
          libs = [p for p in mine if any("lib" in t["kind"] for t in p["targets"])]
          print(f"packages={sel(mine)}")
          print(f"libs={sel(libs)}")
          print(f"evals={'true' if any(p['name'] == 'goodfood-evals' for p in mine) else 'false'}")
          print(f"load={load[k - 1]} of {sum(load)}")
          PY
          cat "$RUNNER_TEMP/part.txt"
          cat "$RUNNER_TEMP/part.txt" >> "$GITHUB_OUTPUT"
      - name: Build the tests
        working-directory: backend
        run: cargo nextest run --locked --no-run ${{ steps.part.outputs.packages }}
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 60); do
            docker exec pg pg_isready -U postgres -h 127.0.0.1 > /dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs pg; exit 1
      - name: Tests (T1, T2)
        working-directory: backend
        run: cargo nextest run --locked --no-fail-fast --no-tests=pass ${{ steps.part.outputs.packages }}
      - name: Doc tests
        if: ${{ !cancelled() && steps.part.outputs.libs != '' }}
        working-directory: backend
        run: cargo test --doc --locked ${{ steps.part.outputs.libs }}
      - name: Evaluation suites are well formed (T5 dataset check)
        if: ${{ !cancelled() && steps.part.outputs.evals == 'true' }}
        working-directory: backend
        run: cargo run --quiet --locked -p goodfood-evals -- --root ../evals

  rust:
    # The aggregate the farm/ci description names: fmt, clippy, api-types, every test
    # partition, doc tests and the evaluation dataset check.
    needs: [setup, rust-lint, rust-test]
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every Rust job passed
        env:
          LINT: ${{ needs.rust-lint.result }}
          TEST: ${{ needs.rust-test.result }}
        run: |
          echo "fmt/clippy/api-types=$LINT tests/doc-tests/evals=$TEST"
          [ "$LINT" = success ] && [ "$TEST" = success ]

  supply-chain:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ needs.setup.outputs.source_ref }}
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: cargo-deny and cargo-audit
        env:
          RELEASE_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${RUNNER_OS:-}" == Linux && "${RUNNER_ARCH:-}" == X64 && "$CARGO_DENY_VERSION" == 0.20.2 && "$CARGO_AUDIT_VERSION" == 0.22.2 ]] || { echo '::error::unsupported Rust security tool pins or runner'; exit 1; }
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          fetch() {
            if curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 15 --max-time 180 --retry 2 --retry-max-time 240 -o "$2" "$1"; then return; fi
            curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 15 --max-time 180 --retry 2 --retry-max-time 240 -H "Authorization: Bearer ${RELEASE_API_TOKEN:?}" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' -o "$2" "$3"
          }
          deny="$RUNNER_TEMP/deny.tar.gz"; audit="$RUNNER_TEMP/audit.tgz"
          fetch "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" "$deny" 'https://api.github.com/repos/EmbarkStudios/cargo-deny/releases/assets/471598214'
          printf '%s  %s\n' 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f "$deny" | sha256sum -c -
          fetch "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}.tgz" "$audit" 'https://api.github.com/repos/rustsec/rustsec/releases/assets/439292222'
          printf '%s  %s\n' 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428 "$audit" | sha256sum -c -
          tar -xzf "$deny" -C "$bin" --strip-components=1 "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          tar -xzf "$audit" -C "$bin" --strip-components=1 "cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}/cargo-audit"
          export PATH="$bin:$PATH"
          cargo deny --version | grep -F "cargo-deny $CARGO_DENY_VERSION"
          cargo audit --version | grep -F "cargo-audit $CARGO_AUDIT_VERSION"
          echo "$bin" >> "$GITHUB_PATH"
      - name: cargo-deny (policy in backend/deny.toml)
        run: cargo deny --manifest-path backend/Cargo.toml check
      - name: cargo-audit (RUSTSEC-2023-0071 for rsa is accepted, see backend/deny.toml)
        if: ${{ !cancelled() }}
        run: cargo audit --file backend/Cargo.lock --ignore RUSTSEC-2023-0071

  # Every check of the private ci.yml that is not Rust (its scripts, docs, deploy, infra,
  # contracts, workflows and secrets jobs) plus the farm's own. Each step runs even when an
  # earlier one failed, so one run reports every problem.
  scripts:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ needs.setup.outputs.source_ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Compare with main
        id: base
        run: |
          set -euo pipefail
          # A commit on main is compared with its first parent (what its push added);
          # any other commit with where it left main.
          if git merge-base --is-ancestor HEAD origin/main; then
            base="$(git rev-parse -q --verify 'HEAD^1' || git rev-parse HEAD)"; on_main=true
          else
            base="$(git merge-base HEAD origin/main)"; on_main=false
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"; echo "on_main=$on_main" >> "$GITHUB_OUTPUT"
          echo "comparing with $base (on main: $on_main)"
      - name: Tools (kustomize, kubeconform, gitleaks, actionlint)
        env:
          RELEASE_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          fetch() {
            if curl -fsSL --connect-timeout 15 --max-time 180 --retry 2 --retry-max-time 240 -o "$2" "$1"; then return; fi
            local asset
            # Asset IDs are pinned to these versions. Fail rather than silently install an older tool.
            case "$2" in
              kustomize.*) [[ "$KUSTOMIZE_VERSION" == v5.8.1 ]] || return 1 ;;
              kubeconform.*) [[ "$KUBECONFORM_VERSION" == v0.8.0 ]] || return 1 ;;
              gitleaks.*) [[ "$GITLEAKS_VERSION" == 8.30.1 ]] || return 1 ;;
              actionlint.*) [[ "$ACTIONLINT_VERSION" == 1.7.12 ]] || return 1 ;;
              tofu.zip) [[ "$TOFU_VERSION" == 1.12.1 ]] || return 1 ;;
              tflint.zip) [[ "$TFLINT_VERSION" == v0.64.0 ]] || return 1 ;;
              *) echo "::error::no pinned official asset for $2"; return 1 ;;
            esac
            case "$2" in
              kustomize.tgz) asset=353160972 ;;
              kustomize.sums) asset=353160973 ;;
              kubeconform.tgz) asset=438612666 ;;
              kubeconform.sums) asset=438612682 ;;
              gitleaks.tgz) asset=378332058 ;;
              gitleaks.sums) asset=378333193 ;;
              actionlint.tgz) asset=384924896 ;;
              actionlint.sums) asset=384924918 ;;
              tofu.zip) asset=430979398 ;;
              tflint.zip) asset=480528344 ;;
              *) echo "::error::no pinned official asset for $2"; return 1 ;;
            esac
            echo "Release download unavailable; trying the pinned official asset API for $2"
            curl -fsSL --connect-timeout 15 --max-time 180 --retry 2 --retry-max-time 240 -H "Authorization: Bearer ${RELEASE_API_TOKEN:?}" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' -o "$2" "https://api.github.com/repos/$3/releases/assets/$asset"
          }
          fetch "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" kustomize.tgz kubernetes-sigs/kustomize
          fetch "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/checksums.txt" kustomize.sums kubernetes-sigs/kustomize
          grep " kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz\$" kustomize.sums | sed 's/ .*/  kustomize.tgz/' | sha256sum -c -
          fetch "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" kubeconform.tgz yannh/kubeconform
          fetch "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/CHECKSUMS" kubeconform.sums yannh/kubeconform
          grep " kubeconform-linux-amd64.tar.gz\$" kubeconform.sums | sed 's/ .*/  kubeconform.tgz/' | sha256sum -c -
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks.tgz gitleaks/gitleaks
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" gitleaks.sums gitleaks/gitleaks
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" gitleaks.sums | sed 's/ .*/  gitleaks.tgz/' | sha256sum -c -
          fetch "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint.tgz rhysd/actionlint
          fetch "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" actionlint.sums rhysd/actionlint
          grep " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz\$" actionlint.sums | sed 's/ .*/  actionlint.tgz/' | sha256sum -c -
          # These archive digests are pinned to Linux/X64 and the version guards above.
          [[ "${RUNNER_OS:-}" == Linux && "${RUNNER_ARCH:-}" == X64 && "$TOFU_VERSION" == 1.12.1 && "$TFLINT_VERSION" == v0.64.0 ]] || { echo '::error::unsupported infra tool pins or runner'; exit 1; }
          fetch "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip" tofu.zip opentofu/opentofu
          echo '1fc9af962e3632b7cd0ba27076cd9f1ced177567defe9e331ac37f5a40468575  tofu.zip' | sha256sum -c -
          fetch "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip" tflint.zip terraform-linters/tflint
          echo 'cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537  tflint.zip' | sha256sum -c -
          unzip -q -o tofu.zip tofu -d "$bin"
          unzip -q -o tflint.zip tflint -d "$bin"
          export PATH="$bin:$PATH"
          "$bin/tofu" version | grep -F "OpenTofu v$TOFU_VERSION"
          "$bin/tflint" --version | grep -F "TFLint version ${TFLINT_VERSION#v}"
          tar -xzf kustomize.tgz -C "$bin" kustomize
          tar -xzf kubeconform.tgz -C "$bin" kubeconform
          tar -xzf gitleaks.tgz -C "$bin" gitleaks
          tar -xzf actionlint.tgz -C "$bin" actionlint
          echo "$bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: PyYAML
        run: python -m pip install --quiet "pyyaml==$PYYAML_VERSION"

      # scripts
      - name: Python unit tests
        if: ${{ !cancelled() }}
        run: |
          rc=0
          for d in scripts/test scripts/lib scripts/ci scripts/secrets; do
            for p in 'test_*.py' '*_test.py'; do
              if compgen -G "$d/$p" > /dev/null; then
                echo "::group::$d $p"
                python -I -m unittest discover -s "$d" -p "$p" || { rc=1; echo "::error::python tests failed in $d ($p)"; }
                echo "::endgroup::"
              fi
            done
          done
          exit $rc
      - name: Shell test suites (every suite runs; failures are collected)
        if: ${{ !cancelled() }}
        run: |
          rc=0; failed=()
          while IFS= read -r t; do
            echo "::group::$t"
            if ! bash "$t"; then rc=1; failed+=("$t"); fi
            echo "::endgroup::"
          done < <(find scripts -name '*_test.sh' | sort)
          for t in "${failed[@]}"; do echo "::error file=$t::$t failed"; done
          exit $rc
      - name: ShellCheck
        if: ${{ !cancelled() }}
        run: git ls-files -z 'scripts/*.sh' 'scripts/dev/hooks/*' | xargs -0 shellcheck -x -S warning
      - name: Secrets inventory is valid (no values, known vaults, rotation fields)
        if: ${{ !cancelled() }}
        run: bash scripts/secrets/check.sh
      - name: Public site structure, links and draft banners
        if: ${{ !cancelled() }}
        run: python -I scripts/ci/check-site.py
      - name: Relative links and anchors
        if: ${{ !cancelled() }}
        run: python -I scripts/ci/check-links.py
      - name: Requirement coverage listing
        if: ${{ !cancelled() }}
        run: python -I scripts/test/req-coverage.py --lane-tests T8 > /dev/null
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !cancelled() }}
        with:
          go-version-file: scripts/design/gen-tokens/go.mod
          cache: false
      - name: Design tokens are generated and accessible
        if: ${{ !cancelled() }}
        run: |
          go -C scripts/design/gen-tokens test -race -count=1 ./...
          go -C scripts/design/gen-tokens run . --check
      # secrets (gitleaks): only what this commit adds to main. The findings are redacted, and
      # only the rule, file, line and commit are printed.
      - name: gitleaks on the commits this change adds
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -uo pipefail
          range="$BASE..HEAD"; [ "$BASE" = "$(git rev-parse HEAD)" ] && range="-1 HEAD"
          rc=0
          gitleaks git --redact --no-banner --log-level warn --config .gitleaks.toml \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" --log-opts="$range" . || rc=$?
          if [ "$rc" -ne 0 ] && [ -s "$RUNNER_TEMP/gitleaks.json" ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::gitleaks \(.RuleID) in commit \(.Commit[0:12])"' "$RUNNER_TEMP/gitleaks.json"
          fi
          exit $rc

      # deploy
      - name: Chart, add-ons, release values, schemas, connection budget and pins
        if: ${{ !cancelled() }}
        run: scripts/ci/check-helm.sh
      - name: Backend, chart and OpenTofu agree (PostgreSQL version, max_connections)
        if: ${{ !cancelled() }}
        run: python -I scripts/ci/check-infra-consistency.py
      - name: A changed chart has a new version
        if: ${{ !cancelled() && steps.base.outputs.on_main == 'false' }}
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          if ! git diff --quiet "$BASE" -- infra/helm/goodfood; then
            old="$(git show "$BASE:infra/helm/goodfood/Chart.yaml" 2>/dev/null | awk '/^version:/{print $2}')"
            new="$(awk '/^version:/{print $2}' infra/helm/goodfood/Chart.yaml)"
            if [ -n "$old" ] && [ "$old" = "$new" ]; then
              echo "::error file=infra/helm/goodfood/Chart.yaml::the chart changed but its version is still $new; bump it"
              exit 1
            fi
          fi

      # workflows
      - name: actionlint
        if: ${{ !cancelled() }}
        run: actionlint -color
      - name: Every action is pinned to a full commit SHA
        if: ${{ !cancelled() }}
        run: |
          if grep -rnE '^\s*-?\s*uses:\s*[^./][^@]*@([^ #]{0,39}|[^ #]*[^0-9a-f ][^ #]*)(\s|$)' .github/workflows; then
            echo "::error::pin every action to a 40-character commit SHA with the tag in a comment"
            exit 1
          fi

      # contracts (Spectral, oasdiff through go run)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !cancelled() }}
        with:
          go-version-file: tests/go.mod
          cache: false
      - name: Cache Go builds (oasdiff)
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: farm-policy-go-${{ runner.os }}-${{ hashFiles('scripts/contracts/breaking-check.sh', 'tests/go.mod') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version: 22
      - name: Spectral and oasdiff (T3)
        if: ${{ !cancelled() }}
        run: scripts/contracts/breaking-check.sh --base "${{ steps.base.outputs.base }}"
      # Skipped on commits from before the check existed (goodfood-main d3f0e14): a work branch
      # that has not merged main since must not fail on a missing script.
      - name: Migrations that already landed are never renamed, edited or deleted
        if: ${{ !cancelled() && hashFiles('scripts/ci/check-migrations-immutable.py') != '' }}
        run: python3 -I scripts/ci/check-migrations-immutable.py --base "${{ steps.base.outputs.base }}"
      # Billing refuses a different document under a version it stored, and the api and worker
      # crash-loop (staging, 2026-11-03). Skipped on commits from before the check existed.
      - name: A changed billing document has a new version
        if: ${{ !cancelled() && hashFiles('scripts/ci/check-billing-version.py') != '' }}
        run: python -I scripts/ci/check-billing-version.py --base "${{ steps.base.outputs.base }}"
      - name: Black-box journeys compile (tests/, go vet and go build; nothing runs against a server)
        if: ${{ !cancelled() }}
        working-directory: tests
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt the files above"; exit 1; }
          go vet ./...
          go build ./...
          go test -count=1 -run '^$' ./...
      # tests/load checks that need no server: budgets.json against PERFORMANCE_GOALS §3.1
      # (so a budget change cannot merge while k6's thresholds keep the old numbers), the
      # write accounting, the stress arithmetic, the budget gating and lib.js's node tests
      # (target allowlist, duplicate counting; node 22 is set up above). Skipped on commits
      # from before tests/load had them.
      - name: tests/load checks that need no server (budget drift, write accounting)
        if: ${{ !cancelled() && hashFiles('tests/load/budgets.json') != '' }}
        working-directory: tests
        env:
          LOAD_REQUIRE_NODE: '1'
        run: go test -count=1 -run 'TestBudgetTable|TestWriteAccounting|TestStressAnalysis|TestSummaryShape|TestBudgetUnmet|TestLoadLib' ./load/
      # The compatibility-replay harness and every committed archive against a mirror (no
      # backend; farm-replay.yml replays them against the local stack). Skipped on commits
      # from before the harness existed (B9 Task 23).
      - name: Compatibility-replay harness (T3, tests/contract/replay)
        if: ${{ !cancelled() && hashFiles('tests/contract/replay/*.go') != '' }}
        working-directory: tests
        run: go test -count=1 ./contract/replay/...

      # infra

      - name: OpenTofu format
        if: ${{ !cancelled() }}
        run: tofu fmt -check -recursive infra/tofu
      - name: Cache OpenTofu providers
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: farm-tofu-${{ runner.os }}-${{ hashFiles('infra/tofu/**/.terraform.lock.hcl') }}
          restore-keys: farm-tofu-${{ runner.os }}-
      - name: Validate every OpenTofu root without a backend
        if: ${{ !cancelled() }}
        env:
          TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for root in infra/tofu/envs/*/; do
            echo "::group::$root"
            tofu -chdir="$root" init -backend=false -input=false -lockfile=readonly > /dev/null
            tofu -chdir="$root" validate
            echo "::endgroup::"
          done

      - name: TFLint
        if: ${{ !cancelled() }}
        env:
          # The farm's own read-only token, only for TFLint's plugin download rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cfg="$PWD/.tflint.hcl"
          tflint --init --config "$cfg"
          cd infra/tofu && tflint --recursive --config "$cfg"
      - name: Configuration scan (Trivy)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          skip-dirs: .claude
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Email ingest Worker tests
        if: ${{ !cancelled() }}
        working-directory: infra/cloudflare/workers/email-ingest
        run: npm run check && npm test

  report:
    needs: [setup, rust, supply-chain, scripts]
    # Also on a cancelled run once setup has posted pending, so farm/ci never stays pending:
    # a cancelled run posts error, but only while farm/ci still points at this run, so a run
    # that superseded it keeps its own status. A job that timed out counts as failed.
    if: ${{ always() && needs.setup.outputs.source_ref != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Re-run farm-build's deploy-staging job that is waiting for this farm/ci.
      actions: write
    steps:
      # cancelled() works only in an if: condition, so a step records it for the report.
      - name: Was the run cancelled
        id: run
        if: ${{ cancelled() }}
        run: echo "cancelled=true" >> "$GITHUB_OUTPUT"
      - name: Report the result to the private commit
        id: report
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          SHA: ${{ needs.setup.outputs.source_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CANCELLED: ${{ steps.run.outputs.cancelled == 'true' }}
          SETUP: ${{ needs.setup.result }}
          RUST: ${{ needs.rust.result }}
          SUPPLY: ${{ needs.supply-chain.result }}
          SCRIPTS: ${{ needs.scripts.result }}
        run: |
          set -euo pipefail
          if [ "$CANCELLED" = true ] || [[ " $SETUP $RUST $SUPPLY $SCRIPTS " == *" cancelled "* ]]; then
            current="$(gh api "repos/$PRIVATE_REPO/commits/$SHA/status" \
              --jq '[.statuses[] | select(.context == "farm/ci")][0].target_url // ""')"
            if [ "$current" != "$RUN_URL" ]; then
              echo "run cancelled; $STATUS_CONTEXT points at ${current:-nothing} and is left as it is"; exit 0
            fi
            state=error; desc="cancelled (rust=$RUST supply-chain=$SUPPLY scripts=$SCRIPTS); re-dispatch farm-ci"
          elif [ "$SETUP" = success ] && [ "$RUST" = success ] && [ "$SUPPLY" = success ] \
             && [ "$SCRIPTS" = success ]; then
            state=success; desc="Build farm checks passed"
          else
            state=failure; desc="rust=$RUST supply-chain=$SUPPLY scripts=$SCRIPTS"
            [ "$SETUP" = success ] || desc="setup=$SETUP $desc"
          fi
          gh api "repos/$PRIVATE_REPO/statuses/$SHA" -X POST \
            -f state="$state" -f context="$STATUS_CONTEXT" -f target_url="$RUN_URL" -f description="$desc" > /dev/null
          echo "$STATUS_CONTEXT: $state ($desc)"
          # This job succeeds once the status is posted; the run itself is red through the
          # failing check job, so a failure shows once, where it happened.
          {
            echo "### $STATUS_CONTEXT: $state"
            echo "$desc"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      # farm-build's deploy-staging gate does not wait on a runner: when farm/ci was still pending
      # it left farm/deploy=pending ('waiting for farm/ci') pointing at its run. Hand it back now.
      - name: Hand a waiting staging deploy back to farm-build
        if: ${{ always() && steps.report.outputs.state != '' }}
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
          FARM_TOKEN: ${{ github.token }}
          SHA: ${{ needs.setup.outputs.source_ref }}
          STATE: ${{ steps.report.outputs.state }}
        run: |
          set -euo pipefail
          waiting="$(GH_TOKEN=$PAT gh api "repos/$PRIVATE_REPO/commits/$SHA/status" \
            --jq '[.statuses[] | select(.context == "farm/deploy")][0] | select(.state == "pending" and (.description | startswith("waiting for farm/ci"))) | .target_url')"
          [ -n "$waiting" ] || { echo "no staging deploy waits for this commit"; exit 0; }
          # A cancelled run (error) leaves the deploy waiting for the farm-ci run that replaces it.
          [ "$STATE" != error ] || { echo "farm/ci is error (cancelled): the deploy keeps waiting"; exit 0; }
          run_id="${waiting##*/runs/}"; run_id="${run_id%%[!0-9]*}"
          if [ "$STATE" != success ]; then
            GH_TOKEN=$PAT gh api "repos/$PRIVATE_REPO/statuses/$SHA" -X POST -f context=farm/deploy \
              -f target_url="$waiting" -f state=error -f description="not deployed: farm/ci is $STATE" > /dev/null
            echo "farm/ci is $STATE: the waiting deploy of run $run_id is not re-run"; exit 0
          fi
          for i in 1 2 3 4 5 6; do
            job="$(GH_TOKEN=$FARM_TOKEN gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
              --jq '.jobs[] | select(.name == "deploy-staging") | .id' | head -1)"
            if [ -n "$job" ] && { GH_TOKEN=$FARM_TOKEN gh run rerun "$run_id" --job "$job" -R "$GITHUB_REPOSITORY" \
                 || GH_TOKEN=$PAT gh run rerun "$run_id" --job "$job" -R "$GITHUB_REPOSITORY"; }; then
              echo "re-ran deploy-staging of farm-build run $run_id"; exit 0
            fi
            sleep $((i * 10))  # the run may still be finishing
          done
          echo "::warning::could not re-run deploy-staging of farm-build run $run_id; re-run it by hand"
