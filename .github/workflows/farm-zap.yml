# The nightly OWASP ZAP API scan of staging (lane T9, Phase 1 gate G14) for the private
# Mom-s-Food/goodfood-main repository. It runs scripts/test/security-scan.sh --dast --env staging
# from the private source: a fresh synthetic user (qa+zap-<run>@synthetic.goodfood.test) signs in
# through the staging-only qa-replay route, ZAP (pinned by digest in the script) scans every
# contract operation and the connector routes, the user is deleted, and a High-risk alert fails
# the run unless a reviewed row of tests/security/zap/rules.tsv says otherwise.
#
# Logs of a public repository are public. QA_SIGNIN_KEY (the staging qa-replay key, a repository
# secret added through SECRETS.md "Adding a new credential", B9 decision 2) reaches only the scan
# step through its environment; the script passes it to curl on stdin, never prints it, and
# refuses to keep a report that carries it or a token. Until the secret exists the run says so
# and stops green, so the schedule can be in place before the owner's approval.
# Artifacts of a public repository are public too: a real finding must not be published before
# it is fixed. The scan runs with --public-log, so this log shows only counts of alerts per level
# (no alert names, plugin ids, URLs or ZAP output), and the reports are kept only encrypted with
# age to the owner's public key in the repository variable ZAP_REPORT_AGE_RECIPIENT (a public
# key, not a secret). Until that variable exists no report is kept at all.
# Production is never scanned: the script refuses --env production and any server whose
# /v1/config reports another environment. A schedule runs only this repository's own workflow
# on the private main, never code from a fork.
# After the scan, the same job runs the Go attack tests of tests/security/ against staging
# (go -C tests test -count=1 ./security/...). Those that need a signed-in user sign up their own
# synthetic users with QA_SIGNIN_KEY, which reaches only that step; the tests never print a token,
# a code or a key, and skip on any server that reports environment production. They run even when
# the scan failed, so one never hides the other.
name: farm-zap

on:
  schedule:
    # 02:40 UTC nightly; GitHub may start a scheduled run late.
    - cron: '40 2 * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Full commit SHA of Mom-s-Food/goodfood-main for the plan, rules and script; empty uses main'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: farm-zap
  cancel-in-progress: false

env:
  PRIVATE_REPO: Mom-s-Food/goodfood-main
  # The staging API (ADR-0018: the free node's load balancer).
  GOODFOOD_API_URL: https://api.64-181-241-30.sslip.io
  # The owner's age public key (age1...); empty keeps no report.
  ZAP_REPORT_RECIPIENT: ${{ vars.ZAP_REPORT_AGE_RECIPIENT }}

jobs:
  zap:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Is the qa-replay key on the farm
        id: key
        env:
          QA_SIGNIN_KEY: ${{ secrets.QA_SIGNIN_KEY }}
        run: |
          if [ -n "$QA_SIGNIN_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::QA_SIGNIN_KEY is not a secret of this repository yet (B9 decision 2); nothing scanned"
          fi
      - name: Validate the request
        if: steps.key.outputs.ready == 'true'
        env:
          REQUESTED: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ] && ! printf '%s' "$REQUESTED" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source_ref must be a full lowercase commit SHA"; exit 1
          fi
      - name: Check out the private source
        if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.source_ref || 'main' }}
          persist-credentials: false
      - name: Set up Go
        if: steps.key.outputs.ready == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/go.mod
          cache: false
      - name: Install age
        if: steps.key.outputs.ready == 'true' && env.ZAP_REPORT_RECIPIENT != ''
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends age
          age --version
      - name: ZAP scan of staging
        if: steps.key.outputs.ready == 'true'
        env:
          QA_SIGNIN_KEY: ${{ secrets.QA_SIGNIN_KEY }}
        run: |
          set -euo pipefail
          echo "source $(git rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/zap"
          keep=()
          if [ -n "$ZAP_REPORT_RECIPIENT" ]; then
            keep=(--encrypt-to "$ZAP_REPORT_RECIPIENT")
          else
            echo "::warning::ZAP_REPORT_AGE_RECIPIENT is not a variable of this repository; no report is kept"
          fi
          scripts/test/security-scan.sh --dast --env staging --public-log "${keep[@]}" --report-dir "$RUNNER_TEMP/zap"
      - name: Attack tests against staging (T9)
        if: ${{ !cancelled() && steps.key.outputs.ready == 'true' }}
        timeout-minutes: 20
        env:
          BASE_URL: ${{ env.GOODFOOD_API_URL }}
          QA_SIGNIN_KEY: ${{ secrets.QA_SIGNIN_KEY }}
        run: |
          set -euo pipefail
          echo "source $(git rev-parse HEAD)"
          go -C tests test -count=1 ./security/...
      - name: Keep the encrypted reports
        if: ${{ !cancelled() && steps.key.outputs.ready == 'true' && env.ZAP_REPORT_RECIPIENT != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report-${{ github.run_id }}
          # Only the age ciphertext: never a plaintext report from a public repository.
          path: ${{ runner.temp }}/zap/*.age
          if-no-files-found: warn
          retention-days: 30
