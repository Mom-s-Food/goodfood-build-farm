# The external probe of staging (B9 plan Task 5, decision 3; ALERTS): every 5 minutes,
# from outside OCI, scripts/validation/probe.sh of the private repository signs a
# synthetic user in through qa-replay, logs a typed meal, reads it on Today and deletes
# it, each step within its PERFORMANCE_GOALS budget plus a 170 ms round-trip allowance.
#
# Why a chain and not a '*/5' schedule: GitHub's cron is best effort. The '*/5' schedule
# this file had from 2026-10-31 03:01Z started no run in over two hours (the workflow
# active, on the default branch, YAML parsed), and the private repository's daily 07:17
# schedule started 5 to 7 hours late every day (2026-10-25..29). So the clock is this
# workflow itself: one run holds one runner for about 5 h 40 min, probes at every
# 5-minute mark of the clock, then dispatches its successor (workflow_dispatch from
# GITHUB_TOKEN does start a run) and ends; the successor waits in the farm-probe group
# and starts within a minute or two. The hourly schedule is only a backstop that restarts
# a broken chain; when a chain run is alive, the backstop run waits in the group and the
# chain's next dispatch replaces it. To stop the probe: disable this workflow.
#
# One failed probe does not fail the run: two failed probes in a row (also across the
# handover, through last_ok) hand over to the next run and then fail this one, so GitHub's
# workflow-failure mail reaches the owner. Every run keeps probe-<run id> (results.jsonl:
# one line per probe with its time, ok, step names, statuses and timings; no key, code or
# token) for 30 days; scripts/probe-window.py reads them and counts the 7-day window.
#
# Which probe.sh: inputs.source_ref, else PROBE_DEFAULT_REF below, else main; a pinned
# commit gives way to main as soon as main contains it. No probe.sh or no QA_SIGNIN_KEY:
# the run records "skipped", passes and ends the chain (the backstop retries hourly).
# Logs are public: the key reaches probe.sh only through its environment, never printed.
name: farm-probe
run-name: farm-probe ${{ inputs.probes && format('x{0}', inputs.probes) || 'chain' }} ${{ inputs.source_ref || 'default' }}

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Full commit SHA of Mom-s-Food/goodfood-main to take probe.sh from; empty takes PROBE_DEFAULT_REF, then main'
        required: false
        default: ''
      probes:
        description: 'A number of probes for a one-off run that dispatches no successor; empty runs the chain'
        required: false
        default: ''
      last_ok:
        description: 'Set by the chain: whether the previous run''s last probe passed (true, false or empty)'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: farm-probe
  cancel-in-progress: false

env:
  PRIVATE_REPO: Mom-s-Food/goodfood-main
  GOODFOOD_API_URL: https://api.64-181-241-30.sslip.io
  # probe.sh is not on the private main yet: b9-probe-today-date (B9 branch plus the
  # Today-date fix). Main replaces it on its own once main contains this commit.
  PROBE_DEFAULT_REF: e2022e7e7807140cc19684fb76fc41029f6b51a7
  RUN_MINUTES: '340'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Validate the request and pick probe.sh's commit
        id: ref
        env:
          REF: ${{ inputs.source_ref }}
          PROBES: ${{ inputs.probes }}
          LAST_OK: ${{ inputs.last_ok }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail
          [ -z "$REF" ] || printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::source_ref must be a full lowercase commit SHA"; exit 1; }
          [ -z "$PROBES" ] || printf '%s' "$PROBES" | grep -Eq '^([1-9]|[1-5][0-9]|60)$' || { echo "::error::probes must be 1 to 60"; exit 1; }
          case "$LAST_OK" in ''|true|false) ;; *) echo "::error::last_ok must be true, false or empty"; exit 1 ;; esac
          ref="${REF:-$PROBE_DEFAULT_REF}"
          if [ -n "$ref" ]; then
            status="$(gh api "repos/$PRIVATE_REPO/compare/$ref...main" --jq .status 2>/dev/null || echo unknown)"
            if [ "$status" = ahead ] || [ "$status" = identical ]; then
              echo "main contains $ref; probing with main"; ref=""
            fi
          fi
          echo "probe.sh from ${ref:-main}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ steps.ref.outputs.ref || 'main' }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Probe staging every 5 minutes
        id: loop
        env:
          QA_SIGNIN_KEY: ${{ secrets.QA_SIGNIN_KEY }}
          PROBES: ${{ inputs.probes }}
          LAST_OK: ${{ inputs.last_ok }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          mkdir -p probe-result
          out=probe-result/results.jsonl
          : > "$out"
          now_iso() { date -u +%Y-%m-%dT%H:%M:%SZ; }
          skip() {
            echo "::notice::$1; skipped (the run passes and dispatches no successor)"
            jq -nc --arg at "$(now_iso)" --arg why "$1" --argjson run "$RUN_ID" '{at: $at, ok: null, skipped: $why, run: $run, seq: 1}' >> "$out"
            echo "skipped=true" >> "$GITHUB_OUTPUT"; exit 0
          }
          [ -f scripts/validation/probe.sh ] || skip "scripts/validation/probe.sh is not on the chosen commit"
          [ -n "$QA_SIGNIN_KEY" ] || skip "the QA_SIGNIN_KEY farm secret is not set (B9 decision 2)"
          start=$(date +%s)
          if [ -n "$PROBES" ]; then max=$PROBES; end=$((start + 300 * PROBES + 60)); else max=100000; end=$((start + RUN_MINUTES * 60)); fi
          prev="$LAST_OK" n=0 failed_two=false
          while :; do
            n=$((n + 1))
            rm -f probe-result/one.json
            echo "::group::probe $n at $(now_iso)"
            if bash scripts/validation/probe.sh --env staging --result probe-result/one.json; then ok=true; else ok=false; fi
            echo "::endgroup::"
            [ -s probe-result/one.json ] || jq -n --arg at "$(now_iso)" '{at: $at, steps: []}' > probe-result/one.json
            jq -c --argjson ok "$ok" --argjson run "$RUN_ID" --argjson seq "$n" '. + {ok: $ok, run: $run, seq: $seq}' probe-result/one.json >> "$out"
            echo "probe $n: ok=$ok"
            if [ "$ok" = false ]; then
              if [ "$prev" = false ]; then
                echo "::error::two probes in a row failed (probe $n of run $RUN_ID and the one before)"
                prev=false failed_two=true; break
              fi
              echo "::warning::probe $n failed once; the next failure fails the run"
            fi
            prev=$ok
            [ "$n" -lt "$max" ] || break
            now=$(date +%s); next=$(( (now / 300 + 1) * 300 ))
            [ "$next" -lt "$end" ] || break
            sleep $((next - now))
          done
          { echo "last_ok=$prev"; echo "failed_two=$failed_two"; echo "count=$n"; } >> "$GITHUB_OUTPUT"
          echo "$n probes; last ok=$prev"
      - name: Hand over to the next run
        if: ${{ !cancelled() && (inputs.probes || '') == '' && steps.loop.outputs.skipped != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ steps.ref.outputs.ref }}
          LAST_OK: ${{ steps.loop.outputs.last_ok }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run farm-probe.yml -R "$REPO" --ref main -f source_ref="$REF" -f last_ok="$LAST_OK"; then
              echo "dispatched the next run (attempt $attempt)"; exit 0
            fi
            sleep 20 # the dispatch API failed; try again shortly
          done
          echo "::error::could not dispatch the next run; the hourly backstop restarts the chain"; exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: probe-${{ github.run_id }}
          path: probe-result/results.jsonl
          retention-days: 30
      - name: Two failed probes in a row fail the run
        if: ${{ steps.loop.outputs.failed_two == 'true' }}
        run: |
          echo "::error::the probe failed twice in a row; see the probe groups above"
          exit 1
