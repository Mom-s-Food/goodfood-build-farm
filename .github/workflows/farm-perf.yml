# EXPERIMENT (branch t8-a1-build, never merged to the default branch): builds lane T8's
# b7_t8 test binary (release, aarch64) on a free ubuntu-24.04-arm runner for the T8 meal-save
# burst on a short-lived Always Free Ampere A1 instance (docs/plans/gates/b9/load.md of the
# private repo). It runs nothing. The binary and the source files it reads at run time
# (backend, infra, contracts) are encrypted with age to a throwaway ssh-ed25519 key (the
# `recipient` input; only the A1 run holds its private half) before upload, so the public
# artifact is unreadable; it is kept for one day. It posts no commit status.
name: farm-perf

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Full commit SHA of Mom-s-Food/goodfood-main'
        required: true
      recipient:
        description: 'ssh-ed25519 public key (an age recipient) whose identity only the A1 run holds'
        required: true

permissions:
  contents: read

concurrency:
  group: farm-perf
  cancel-in-progress: false

env:
  PRIVATE_REPO: Mom-s-Food/goodfood-main

jobs:
  build:
    name: T8 burst binary (aarch64, release)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - name: Validate the request
        env:
          REQUESTED: ${{ inputs.source_ref }}
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          set -euo pipefail
          printf '%s' "$REQUESTED" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::source_ref must be a full SHA"; exit 1; }
          printf '%s' "$RECIPIENT" | grep -Eq '^ssh-ed25519 [A-Za-z0-9+/]{68}( [A-Za-z0-9._-]+)?$' || { echo "::error::recipient must be an ssh-ed25519 public key"; exit 1; }
      - name: Check out the private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Rust toolchain (stable) and age
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          sudo apt-get install -y -qq age zstd > /dev/null
      - name: Build the b7_t8 test (release)
        working-directory: backend
        run: |
          set -euo pipefail
          cargo test --release --locked --no-run -p rest --test b7_t8 --message-format=json \
            | jq -r 'select(.reason=="compiler-artifact" and .target.name=="b7_t8" and .executable!=null) | .executable' \
            | tail -1 > "$RUNNER_TEMP/exe"
          exe=$(cat "$RUNNER_TEMP/exe"); test -x "$exe"; ls -l "$exe"; file "$exe"
      - name: Package and encrypt
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pkg"; mkdir -p "$out/src"
          git archive HEAD backend infra contracts | tar -x -C "$out/src"
          cp "$(cat "$RUNNER_TEMP/exe")" "$out/b7_t8"
          printf '%s\n' "$GITHUB_WORKSPACE" > "$out/workspace"
          git rev-parse HEAD > "$out/sha"
          tar -C "$out" -cf - . | zstd -q -19 -T0 | age -r "$RECIPIENT" > "$RUNNER_TEMP/t8-burst.tar.zst.age"
          ls -l "$RUNNER_TEMP/t8-burst.tar.zst.age"; sha256sum "$RUNNER_TEMP/t8-burst.tar.zst.age"
          echo "workspace: $GITHUB_WORKSPACE; runner: $(nproc) vCPU $(uname -m)"
      - name: Upload (encrypted, one day)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t8-burst-aarch64
          path: ${{ runner.temp }}/t8-burst.tar.zst.age
          retention-days: 1
          compression-level: 0
